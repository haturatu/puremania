services:
  puremania:
    build:
      context: .
    image: puremania:local
    container_name: puremania
    user: "${PUREMANIA_UID:-1000}:${PUREMANIA_GID:-1000}"
    network_mode: host
    environment:
      HOME: /home/puremania
      STORAGE_DIR: /home/puremania
      PORT: 8844
      MAX_FILE_SIZE_MB: "${PUREMANIA_MAX_FILE_SIZE_MB:-102400}"
      ZIP_TIMEOUT: "${PUREMANIA_ZIP_TIMEOUT:-300}"
      MAX_ZIP_SIZE: "${PUREMANIA_MAX_ZIP_SIZE:-1024}"
      ARIA2C: "${PUREMANIA_ARIA2C:-disable}"
      HLS_ENABLED: "${PUREMANIA_HLS_ENABLED:-true}"
      HLS_CACHE_DIR: /data/hls
      HLS_CACHE_MAX_MB: "${PUREMANIA_HLS_CACHE_MAX_MB:-2048}"
      HLS_CACHE_MAX_AGE_HOURS: "${PUREMANIA_HLS_CACHE_MAX_AGE_HOURS:-72}"
      HLS_MAX_JOBS: "${PUREMANIA_HLS_MAX_JOBS:-1}"
      MOUNT_DIRS: "${PUREMANIA_MOUNT_DIRS:-}"
      SPECIFIC_DIRS: "${PUREMANIA_SPECIFIC_DIRS:-}"
    volumes:
      # To display your home directory, replace "tux" with your username ($USER)
      - "${PUREMANIA_HOST_HOME:-/home/tux}:/home/puremania"
      - "${PUREMANIA_STORAGE_DIR:-puremania-data}:/data"
    restart: unless-stopped

volumes:
  puremania-data:
