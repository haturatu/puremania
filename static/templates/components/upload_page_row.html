<template id="upload-page-row-template">
    <td><input type="checkbox" class="upload-select" aria-label="Select upload"></td>
    <td class="file-name"></td>
    <td class="file-size"></td>
    <td class="upload-progress-cell">
        <progress class="ui-progress" max="100" value="0" aria-label="Upload progress">0%</progress>
        <span class="progress-text">0%</span>
    </td>
    <td class="status"></td>
    <td class="upload-destination"></td>
    <td class="actions"></td>
</template>
