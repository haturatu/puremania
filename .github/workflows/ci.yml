name: CI & Lint

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run build script
        run: bash build.sh

      - name: Run tests
        run: go test ./...

      - name: Run frontend tests
        run: npm test

      - name: Run go vet
        run: go vet ./...

      - name: Upload Pure Mania build
        uses: actions/upload-artifact@v4
        with:
          name: puremania-build
          path: |
            puremania
            static/index.html
            static/dist/
          retention-days: 1

  browser-e2e:
    name: Chromium browser E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download Pure Mania build
        uses: actions/download-artifact@v4
        with:
          name: puremania-build

      - name: Make binary executable
        run: chmod +x puremania

      - name: Run browser E2E
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_STORAGE_DIR: /tmp/puremania-e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Check formatting
        run: |
          gofmt_output=$(gofmt -l .)
          if [ -n "$gofmt_output" ]; then
            echo "The following files are not formatted correctly:"
            echo "$gofmt_output"
            exit 1
          fi
          echo "All files are correctly formatted."

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          skip-cache: true

  security:
    name: Security and resilience
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Run race detector
        run: go test -race ./...

      - name: Run fuzz smoke test (handlers)
        run: go test ./internal/handlers -run=FuzzParseContentRange -fuzz=FuzzParseContentRange -fuzztime=10s

      - name: Run fuzz smoke test (server)
        run: go test ./internal/middleware -run=FuzzSelectContentEncoding -fuzz=FuzzSelectContentEncoding -fuzztime=10s

      - name: Run HTTP soak test
        run: SOAK_DURATION=15s go test ./internal/middleware -run='^TestHTTPSoak$' -count=1 -timeout=1m

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  container-scan:
    name: Container scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag puremania:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: puremania:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
