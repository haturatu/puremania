name: Browser E2E

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Check browser E2E scope
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: filter
        run: |
          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" -- \
            '**/*.go' 'handlers/**' 'static/**' 'e2e/**' \
            'package.json' 'package-lock.json' 'playwright.config.js' \
            'build.js' 'build.sh' 'go.mod' 'go.sum' \
            '.github/workflows/**'; then
            echo 'e2e=false' >> "$GITHUB_OUTPUT"
          else
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build E2E artifact
    if: needs.changes.outputs.e2e == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Pure Mania
        run: bash build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: puremania-build
          path: |
            puremania
            static/index.html
            static/dist/
          retention-days: 1

  browser-e2e:
    name: Chromium browser E2E
    if: needs.changes.outputs.e2e == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Download Pure Mania build
        uses: actions/download-artifact@v4
        with:
          name: puremania-build

      - name: Make binary executable
        run: chmod +x puremania

      - name: Run browser E2E
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_STORAGE_DIR: /tmp/puremania-e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
